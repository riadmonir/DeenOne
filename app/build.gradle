plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.devflux.deenone'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.devflux.deenone"
        minSdk 24
        targetSdk 37
        versionCode 2
        versionName "1.6.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.core.splashscreen
    implementation libs.recyclerview
    implementation libs.cardview
    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    // Glide for Ultra-Fast Image Loading & Smart Offline Caching
    implementation libs.glide
    annotationProcessor libs.glide.compiler

    // Architecture Components & Lifecycle
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata

    // Room Database
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler

    // WorkManager & Background Tasks
    implementation libs.work.runtime

    // Networking with Retrofit & OkHttp
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson
    implementation libs.okhttp
    implementation libs.okhttp.logging.interceptor

    // Media3 / ExoPlayer for Audio Hub, Quran Playback & Sleep Mode
    implementation libs.media
    implementation libs.media3.exoplayer
    implementation libs.media3.ui
    implementation libs.media3.common
    implementation libs.media3.session
    implementation libs.media3.datasource.okhttp

    // Google Play Services Location for FusedLocationProviderClient
    implementation libs.play.services.location
    implementation libs.play.services.auth

    // Navigation
    implementation libs.navigation.fragment
    implementation libs.navigation.ui

    // Admob
    implementation libs.play.services.ads

    testImplementation libs.junit
    testImplementation 'org.json:json:20260814'
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}