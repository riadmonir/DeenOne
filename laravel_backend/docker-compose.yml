services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: "DeenOne"
      APP_ENV: "production"
      APP_KEY: "base64:DeenOneSuperSecretProductionKey2026=="
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: "mysql"
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_DATABASE: "deenone_db"
      DB_USERNAME: "deanone_user"
      DB_PASSWORD: "secret_db_password"
      QUEUE_CONNECTION: "redis"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      CACHE_STORE: "redis"
    depends_on:
      - mysql
      - redis
    volumes:
      - ./storage:/var/www/html/storage

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "deenone_db"
      MYSQL_USER: "deanone_user"
      MYSQL_PASSWORD: "secret_db_password"
      MYSQL_ROOT_PASSWORD: "root_password_deanone"
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
